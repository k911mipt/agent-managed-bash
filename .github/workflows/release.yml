name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: Original release workflow run ID
        required: true
        type: string
      tag:
        description: Immutable release tag
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  NPM_VERSION: 11.5.1
  SYFT_VERSION: v1.49.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate reviewed release tag
    if: github.event.created == true && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      epoch: ${{ steps.release.outputs.epoch }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'release tag must be an exact vMAJOR.MINOR.PATCH value\n' >&2
            exit 1
          fi
          version=$(tr -d '\r\n' < VERSION)
          test "$RELEASE_TAG" = "v$version"
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          comparison=$(gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/compare/$commit...master" \
            --jq '.status')
          if [[ "$comparison" != ahead && "$comparison" != identical ]]; then
            printf 'release commit is not on master\n' >&2
            exit 1
          fi
          merged_prs=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/commits/$commit/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "master" and .base.repo.full_name == "k911mipt/agent-managed-bash")] | length')
          test "$merged_prs" -gt 0
          epoch=$(git show -s --format=%ct HEAD)
          {
            printf 'commit=%s\n' "$commit"
            printf 'epoch=%s\n' "$epoch"
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

  fresh-guard:
    name: Reject rerun when public state exists
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - name: Check pinned npm
        run: test "$(npm --version)" = "$NPM_VERSION"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install guard dependencies
        run: bun install --frozen-lockfile
      - name: Read only npm and release guard
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          bun scripts/release-publish.ts guard

  verify:
    name: Verify ${{ matrix.target }}
    needs: [validate, fresh-guard]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    env:
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check toolchain
        run: make doctor
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Expose local tools
        run: printf '%s\n' "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check OpenCode
        run: test "$(opencode --version)" = "$(bun -e 'process.stdout.write((await Bun.file("package.json").json()).devDependencies["opencode-ai"])')"
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Run complete verification
        run: make verify

  produce:
    name: Produce ${{ matrix.target }}
    needs: [validate, verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    env:
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check toolchain
        run: make doctor
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create release producer receipts
        run: |
          make release-package
          asset="agent-managed-bash-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz"
          bun scripts/release-candidate.ts producer --asset "dist/$asset" --name "$asset" --version "${{ needs.validate.outputs.version }}" --commit "${{ needs.validate.outputs.commit }}" --output "dist/$asset.receipt.json"
          if [ "${{ matrix.target }}" = linux-amd64 ]; then
            make npm-package
            npm_asset="k911mipt-opencode-agent-managed-bash-${{ needs.validate.outputs.version }}.tgz"
            cp "dist/npm/$npm_asset" "dist/$npm_asset"
            cp packaging/install-release.sh dist/install-release.sh
            for asset in "$npm_asset" install-release.sh; do
              bun scripts/release-candidate.ts producer --asset "dist/$asset" --name "$asset" --version "${{ needs.validate.outputs.version }}" --commit "${{ needs.validate.outputs.commit }}" --output "dist/$asset.receipt.json"
            done
          fi
      - name: Upload native producer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: producer-${{ needs.validate.outputs.tag }}-${{ matrix.target }}
          path: |
            dist/agent-managed-bash-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
            dist/agent-managed-bash-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz.receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload npm producer artifact
        if: matrix.target == 'linux-amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: producer-${{ needs.validate.outputs.tag }}-npm
          path: |
            dist/k911mipt-opencode-agent-managed-bash-${{ needs.validate.outputs.version }}.tgz
            dist/k911mipt-opencode-agent-managed-bash-${{ needs.validate.outputs.version }}.tgz.receipt.json
          retention-days: 90
          compression-level: 0
      - name: Upload bootstrap producer artifact
        if: matrix.target == 'linux-amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: producer-${{ needs.validate.outputs.tag }}-bootstrap
          path: |
            dist/install-release.sh
            dist/install-release.sh.receipt.json
          retention-days: 90
          compression-level: 0

  sbom:
    name: Scan ${{ matrix.asset }}
    needs: [validate, produce]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-amd64
            asset: agent-managed-bash-${{ needs.validate.outputs.version }}-linux-amd64.tar.gz
          - artifact: linux-arm64
            asset: agent-managed-bash-${{ needs.validate.outputs.version }}-linux-arm64.tar.gz
          - artifact: darwin-amd64
            asset: agent-managed-bash-${{ needs.validate.outputs.version }}-darwin-amd64.tar.gz
          - artifact: darwin-arm64
            asset: agent-managed-bash-${{ needs.validate.outputs.version }}-darwin-arm64.tar.gz
          - artifact: npm
            asset: k911mipt-opencode-agent-managed-bash-${{ needs.validate.outputs.version }}.tgz
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install scanner dependencies
        run: bun install --frozen-lockfile
      - name: Download one producer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: producer-${{ needs.validate.outputs.tag }}-${{ matrix.artifact }}
          path: input
      - name: Reverify one producer receipt
        run: bun scripts/release-candidate.ts verify-producer --directory input --name "${{ matrix.asset }}"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: input/${{ matrix.asset }}
          output-file: input/${{ matrix.asset }}.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Create SBOM relation receipt
        run: bun scripts/release-candidate.ts relation --asset "input/${{ matrix.asset }}" --subject-receipt "input/${{ matrix.asset }}.receipt.json" --predicate "input/${{ matrix.asset }}.spdx.json" --schema schemas/spdx-schema.json --output "input/${{ matrix.asset }}.spdx.json.relation.json"
      - name: Upload SBOM relation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relation-${{ needs.validate.outputs.tag }}-${{ matrix.artifact }}
          path: |
            input/${{ matrix.asset }}.spdx.json
            input/${{ matrix.asset }}.spdx.json.relation.json
          retention-days: 90
          compression-level: 0

  prepare:
    name: Prepare verified release candidate
    needs: [validate, produce, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      candidate-id: ${{ steps.candidate.outputs.artifact-id }}
      candidate-digest: ${{ steps.candidate.outputs.artifact-digest }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install prepare dependencies
        run: bun install --frozen-lockfile
      - name: Download producer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: producer-${{ needs.validate.outputs.tag }}-*
          path: producers
          merge-multiple: true
      - name: Download SBOM relation artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: relation-${{ needs.validate.outputs.tag }}-*
          path: relations
          merge-multiple: true
      - name: Assemble release candidate
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_WORKFLOW: release.yml
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: bun scripts/release-candidate.ts assemble --producers producers --relations relations --output candidate --schema schemas/spdx-schema.json
      - name: Read release workflow blob
        id: workflow
        run: printf 'blob=%s\n' "$(git rev-parse HEAD:.github/workflows/release.yml)" >> "$GITHUB_OUTPUT"
      - name: Upload release candidate
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ needs.validate.outputs.tag }}
          path: candidate
          retention-days: 90
          compression-level: 0
      - name: Create private candidate metadata
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_WORKFLOW: release.yml
          RELEASE_WORKFLOW_BLOB: ${{ steps.workflow.outputs.blob }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
          RELEASE_CANDIDATE_ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
        run: bun scripts/release-candidate.ts metadata --candidate candidate --artifact-id "$RELEASE_CANDIDATE_ARTIFACT_ID" --artifact-digest "$RELEASE_CANDIDATE_ARTIFACT_DIGEST" --producers producers --relations relations --schema schemas/spdx-schema.json --output candidate-metadata.json
      - name: Upload private candidate metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-metadata-${{ needs.validate.outputs.tag }}
          path: candidate-metadata.json
          retention-days: 90
          compression-level: 0

  control:
    name: Bind release candidate control receipt
    needs: [validate, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install control dependencies
        run: bun install --frozen-lockfile
      - name: Download candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.validate.outputs.tag }}
          path: candidate
      - name: Download producer receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: producer-${{ needs.validate.outputs.tag }}-*
          path: producers
          merge-multiple: true
      - name: Download private candidate metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-metadata-${{ needs.validate.outputs.tag }}
          path: metadata
      - name: Download relation receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: relation-${{ needs.validate.outputs.tag }}-*
          path: relations
          merge-multiple: true
      - name: Read release workflow blob
        id: workflow
        run: printf 'blob=%s\n' "$(git rev-parse HEAD:.github/workflows/release.yml)" >> "$GITHUB_OUTPUT"
      - name: Create candidate control receipt
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_WORKFLOW: release.yml
          RELEASE_WORKFLOW_BLOB: ${{ steps.workflow.outputs.blob }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_CANDIDATE_ARTIFACT_ID: ${{ needs.prepare.outputs.candidate-id }}
          RELEASE_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.candidate-digest }}
        run: bun scripts/release-candidate.ts control --candidate candidate --artifact-id "$RELEASE_CANDIDATE_ARTIFACT_ID" --artifact-digest "$RELEASE_CANDIDATE_ARTIFACT_DIGEST" --metadata metadata/candidate-metadata.json --output control/CANDIDATE-RECEIPT.json --producers producers --relations relations --schema schemas/spdx-schema.json
      - name: Upload candidate control receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-control-${{ needs.validate.outputs.tag }}
          path: control/CANDIDATE-RECEIPT.json
          retention-days: 90
          compression-level: 0

  recovery:
    name: Validate original release candidate for recovery
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.run.outputs.commit }}
      version: ${{ steps.context.outputs.version }}
      workflow-blob: ${{ steps.run.outputs.workflow-blob }}
    steps:
      - name: Normalize recovery version
        id: context
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Validate original workflow run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          run="repos/$RELEASE_REPOSITORY/actions/runs/$RELEASE_RECOVERY_RUN_ID"
          tagged_commit=$(git rev-parse HEAD)
          test "$tagged_commit" = "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test "$(gh api "$run" --jq .event)" = push
          test "$(gh api "$run" --jq .head_branch)" = "$RELEASE_TAG"
          test "$(gh api "$run" --jq .head_sha)" = "$tagged_commit"
          test "$(gh api "$run" --jq .path)" = .github/workflows/release.yml
          {
            printf 'commit=%s\n' "$tagged_commit"
            printf 'workflow-blob=%s\n' "$(git rev-parse HEAD:.github/workflows/release.yml)"
          } >> "$GITHUB_OUTPUT"
      - name: Download original candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ inputs.tag }}
          path: candidate
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
      - name: Download original control artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-control-${{ inputs.tag }}
          path: control
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install recovery helper dependencies
        run: bun install --frozen-lockfile
      - name: Validate original candidate and receipt
        env:
          RELEASE_COMMIT: ${{ steps.run.outputs.commit }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.run.outputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ steps.context.outputs.version }}
          RELEASE_WORKFLOW: release.yml
          RELEASE_WORKFLOW_BLOB: ${{ steps.run.outputs.workflow-blob }}
        run: |
          set -eu
          bun scripts/release-publish.ts recovery --candidate candidate --control control/CANDIDATE-RECEIPT.json

  stage-release:
    name: Stage npm and release attestations
    needs: [validate, control, recovery]
    if: always() && ((github.event_name == 'push' && needs.control.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.recovery.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    outputs:
      terminal: ${{ steps.publication.outputs.terminal }}
    env:
      RELEASE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && needs.recovery.outputs.commit || needs.validate.outputs.commit }}
      RELEASE_READ_DELAY_MS: 20000
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && needs.recovery.outputs.version || needs.validate.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.recovery.outputs.commit || needs.validate.outputs.commit }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - name: Check pinned npm
        run: test "$(npm --version)" = "$NPM_VERSION"
      - name: Download fresh candidate artifact
        if: github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.validate.outputs.tag }}
          path: candidate
      - name: Download fresh control artifact
        if: github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-control-${{ needs.validate.outputs.tag }}
          path: control
      - name: Download recovery candidate artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ inputs.tag }}
          path: candidate
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
      - name: Download recovery control artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-control-${{ inputs.tag }}
          path: control
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install publication helper dependencies
        run: bun install --frozen-lockfile
      - name: Reconcile staged npm package and draft
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_BOOTSTRAP_VERSION: ${{ vars.NPM_BOOTSTRAP_VERSION }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_FIRST_PUBLISH_BOOTSTRAP: ${{ vars.NPM_BOOTSTRAP_VERSION != '' && 'true' || '' }}
        run: |
          set -eu
          bun scripts/release-publish.ts stage --candidate candidate --control control/CANDIDATE-RECEIPT.json
      - name: Attest all release subjects
        if: steps.publication.outputs.terminal != 'true' && steps.publication.outputs.provenance != ''
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ steps.publication.outputs.provenance }}
      - name: Attest Linux amd64 SBOM
        if: steps.publication.outputs.terminal != 'true' && contains(steps.publication.outputs.sbom, 'linux-amd64.tar.gz')
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: candidate/agent-managed-bash-${{ env.RELEASE_VERSION }}-linux-amd64.tar.gz
          sbom-path: candidate/agent-managed-bash-${{ env.RELEASE_VERSION }}-linux-amd64.tar.gz.spdx.json
      - name: Attest Linux arm64 SBOM
        if: steps.publication.outputs.terminal != 'true' && contains(steps.publication.outputs.sbom, 'linux-arm64.tar.gz')
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: candidate/agent-managed-bash-${{ env.RELEASE_VERSION }}-linux-arm64.tar.gz
          sbom-path: candidate/agent-managed-bash-${{ env.RELEASE_VERSION }}-linux-arm64.tar.gz.spdx.json
      - name: Attest Darwin amd64 SBOM
        if: steps.publication.outputs.terminal != 'true' && contains(steps.publication.outputs.sbom, 'darwin-amd64.tar.gz')
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: candidate/agent-managed-bash-${{ env.RELEASE_VERSION }}-darwin-amd64.tar.gz
          sbom-path: candidate/agent-managed-bash-${{ env.RELEASE_VERSION }}-darwin-amd64.tar.gz.spdx.json
      - name: Attest Darwin arm64 SBOM
        if: steps.publication.outputs.terminal != 'true' && contains(steps.publication.outputs.sbom, 'darwin-arm64.tar.gz')
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: candidate/agent-managed-bash-${{ env.RELEASE_VERSION }}-darwin-arm64.tar.gz
          sbom-path: candidate/agent-managed-bash-${{ env.RELEASE_VERSION }}-darwin-arm64.tar.gz.spdx.json
      - name: Attest npm SBOM
        if: steps.publication.outputs.terminal != 'true' && contains(steps.publication.outputs.sbom, 'k911mipt-opencode-agent-managed-bash-')
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: candidate/k911mipt-opencode-agent-managed-bash-${{ env.RELEASE_VERSION }}.tgz
          sbom-path: candidate/k911mipt-opencode-agent-managed-bash-${{ env.RELEASE_VERSION }}.tgz.spdx.json

  finalize-release:
    name: Finalize immutable GitHub release
    needs: [validate, stage-release, recovery]
    if: always() && needs.stage-release.result == 'success' && needs.stage-release.outputs.terminal != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && needs.recovery.outputs.commit || needs.validate.outputs.commit }}
      RELEASE_READ_DELAY_MS: 20000
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && needs.recovery.outputs.version || needs.validate.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.recovery.outputs.commit || needs.validate.outputs.commit }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - name: Check pinned npm
        run: test "$(npm --version)" = "$NPM_VERSION"
      - name: Download stage candidate artifact
        if: github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.validate.outputs.tag }}
          path: candidate
      - name: Download stage control artifact
        if: github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-control-${{ needs.validate.outputs.tag }}
          path: control
      - name: Download recovery candidate artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ inputs.tag }}
          path: candidate
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
      - name: Download recovery control artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-control-${{ inputs.tag }}
          path: control
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install finalization helper dependencies
        run: bun install --frozen-lockfile
      - name: Revalidate and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          bun scripts/release-publish.ts finalize --candidate candidate --control control/CANDIDATE-RECEIPT.json
