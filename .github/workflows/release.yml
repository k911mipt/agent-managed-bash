name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate reviewed release tag
    if: github.event.created == true && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      epoch: ${{ steps.release.outputs.epoch }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'release tag must be an exact vMAJOR.MINOR.PATCH value\n' >&2
            exit 1
          fi
          version=$(tr -d '\r\n' < VERSION)
          test "$RELEASE_TAG" = "v$version"
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          comparison=$(gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/compare/$commit...master" \
            --jq '.status')
          if [[ "$comparison" != ahead && "$comparison" != identical ]]; then
            printf 'release commit is not on master\n' >&2
            exit 1
          fi
          merged_prs=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/commits/$commit/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "master" and .base.repo.full_name == "k911mipt/agent-managed-bash")] | length')
          test "$merged_prs" -gt 0
          epoch=$(git show -s --format=%ct HEAD)
          {
            printf 'commit=%s\n' "$commit"
            printf 'epoch=%s\n' "$epoch"
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    env:
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Check toolchain
        run: make doctor
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Expose local tools
        run: printf '%s\n' "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check OpenCode
        run: test "$(opencode --version)" = "1.18.4"
      - name: Run complete verification
        run: make verify
      - name: Upload verified release bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ needs.validate.outputs.tag }}-${{ matrix.target }}
          path: dist/agent-managed-bash-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    name: Publish private GitHub release
    needs:
      - validate
      - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-bundle-${{ needs.validate.outputs.tag }}-*
          merge-multiple: true
          path: dist
      - name: Publish private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERIFIED_COMMIT: ${{ needs.validate.outputs.commit }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          cd dist
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            test -f "agent-managed-bash-$VERSION-$target.tar.gz"
          done
          test "$(find . -maxdepth 1 -name 'agent-managed-bash-*.tar.gz' -type f | wc -l | tr -d ' ')" = 4
          sha256sum agent-managed-bash-*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          tag_object=$(gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object.type + " " + .object.sha')
          tag_type=${tag_object%% *}
          tag_sha=${tag_object#* }
          if [[ "$tag_type" == tag ]]; then
            tag_object=$(gh api \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
              --jq '.object.type + " " + .object.sha')
            tag_type=${tag_object%% *}
            tag_sha=${tag_object#* }
          fi
          test "$tag_type" = commit
          test "$tag_sha" = "$VERIFIED_COMMIT"
          gh release create "$RELEASE_TAG" \
            agent-managed-bash-*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
